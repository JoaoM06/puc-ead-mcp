[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puc-ead-mcp"
version = "0.1.0"
description = "MCP server para coletar slides e provas do EAD da PUC-Rio"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joao Araujo", email = "joao.araujo@contornoapp.com" }]
dependencies = [
  "httpx>=0.27",
  "mcp>=2.0",
  "beautifulsoup4>=4.12",
]

[project.scripts]
puc-ead-mcp = "puc_ead_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/puc_ead_mcp"]
